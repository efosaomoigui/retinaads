<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Retinaad · Submissions</title><link rel="stylesheet" href="/admin/assets/admin.css"><script src="/admin/assets/admin.js" defer></script></head>
<body><header class="topbar"><a class="brand" href="/admin">retinaad</a><div><span id="admin-name" class="muted"></span><button id="logout" class="secondary">Sign out</button></div></header><main class="workspace"><p class="eyebrow">CLIENT ADMIN</p><h1>Website submissions</h1>
<nav class="filters" aria-label="Submission categories"><button data-category="all" aria-pressed="true">All requests</button><button data-category="contact" aria-pressed="false">Contact requests</button><button data-category="demo" aria-pressed="false">Demo requests</button><button data-category="careers" aria-pressed="false">Career requests</button><button data-category="website_entry" aria-pressed="false">Website Entry</button><button data-category="other" aria-pressed="false">Other requests</button></nav>
<div class="list-heading"><p id="summary" role="status">Loading submissions…</p><a id="export" class="button secondary" href="/admin/api/export?category=all">Download JSONL</a></div><p id="admin-message" role="alert"></p>
<div class="table-wrap"><table><thead><tr><th>Received</th><th>Name</th><th>Email</th><th>Type</th><th>Status</th><th><span class="sr-only">View</span></th></tr></thead><tbody id="submissions"></tbody></table></div>
<div class="pagination"><button id="previous" class="secondary" disabled>Previous</button><span id="page-number">Page 1</span><button id="next" class="secondary" disabled>Next</button></div>
<dialog id="details" aria-labelledby="detail-title"><div class="detail-header"><h2 id="detail-title">Submission</h2><button id="close-details" class="secondary">Close</button></div><dl id="detail-fields"></dl><a id="resume" class="button" hidden>Download CV</a></dialog>
</main></body></html>
